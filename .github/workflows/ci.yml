name: ATLAS CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  fast:
    name: Fast Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-embeddings-v1
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Pre-populate embeddings model cache
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('BAAI/bge-small-en-v1.5'); snapshot_download('sentence-transformers/all-MiniLM-L6-v2')"

      - name: Run fast test suite
        run: |
          pytest tests/ -m "not slow" -v --tb=short

  security-regression:
    name: Security Regression Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Security regression invariants
        run: |
          pytest tests/test_phase_4m_auth_fail_closed.py \
                tests/test_phase_4t_identity_boundary.py \
                tests/test_phase_4k_f_b_security_redteam.py \
                tests/test_phase_4s_live_index_hotswap.py \
                tests/test_phase_4p_observability.py \
                tests/test_phase_4o_resilience.py \
                tests/test_phase_4q_ingestion_reliability.py \
                tests/test_phase_4r_load_validation.py \
                tests/test_phase_4w_clean_runtime.py \
                -v --tb=short

  docker:
    name: Container Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker build smoke test
        run: |
          docker build -t atlas-service:ci-test .
          docker image inspect atlas-service:ci-test
